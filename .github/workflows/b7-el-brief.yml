name: B7 el brief

on:
  pull_request:
    paths:
      - "B7-el-brief/**"
      - ".github/workflows/b7-el-brief.yml"
  push:
    paths:
      - "B7-el-brief/**"
      - ".github/workflows/b7-el-brief.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: B7-el-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: B7-el-brief/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check:all
