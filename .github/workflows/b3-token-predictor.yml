name: B3 token predictor

on:
  pull_request:
    paths:
      - "B3-token-predictor/**"
      - ".github/workflows/b3-token-predictor.yml"
  push:
    paths:
      - "B3-token-predictor/**"
      - ".github/workflows/b3-token-predictor.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: B3-token-predictor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: B3-token-predictor/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check:all
