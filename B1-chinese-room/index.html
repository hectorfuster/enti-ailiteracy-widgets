<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Habitació · ENTI-UB AI Literacy</title>
<style>
/* =============================================================
   B1 - The Chinese Room
   ENTI-UB AI Literacy Course, Module 1, Chapter 1.
   ============================================================= */

:root {
  --font-serif: Georgia, 'Times New Roman', Times, serif;
  --font-mono: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Consolas, monospace;

  --room-bg:        #15110d;
  --room-bg-deeper: #0e0a07;
  --paper:          #d8c9a8;
  --paper-dim:      #b8aa8d;
  --paper-aged:     #b8a888;
  --paper-worn:     #998a6e;
  --ink-on-paper:   #1a1410;
  --ink-shaky:      #2a1f15;
  --bulb:           #d8c9a8;
  --bulb-soft:      #b3a486;
  --bulb-faint:     #9d8f76;
  --action:         #c8a467;
  --action-hover:   #e0bd84;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--room-bg);
  color: var(--bulb);
  font-family: var(--font-serif);
  font-size: 19px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  transition: filter 2s ease;
}

body.lamp-dim-1 { filter: brightness(0.96); }
body.lamp-dim-2 { filter: brightness(0.92); }
body.lamp-dim-3 { filter: brightness(0.88); }

.room {
  max-width: 620px;
  margin: 0 auto;
  padding: 60px 32px 80px;
  position: relative;
  min-height: 100vh;
}

.room::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 30%, transparent 0%, transparent 30%, rgba(0,0,0,0.4) 100%);
  pointer-events: none;
  z-index: 0;
  transition: background 2s ease;
}

body.lamp-dim-2 .room::before {
  background: radial-gradient(ellipse at 50% 30%, transparent 0%, transparent 25%, rgba(0,0,0,0.55) 100%);
}

body.lamp-dim-3 .room::before {
  background: radial-gradient(ellipse at 50% 30%, transparent 0%, transparent 22%, rgba(0,0,0,0.65) 100%);
}

.room > * { position: relative; z-index: 1; }

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.utility-row {
  min-height: 32px;
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
}

.motion-toggle {
  appearance: none;
  border: 0;
  border-bottom: 1px solid var(--bulb-faint);
  background: transparent;
  color: var(--bulb-soft);
  padding: 5px 0;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  cursor: pointer;
}

.motion-toggle:hover,
.motion-toggle:focus-visible {
  color: var(--action-hover);
  border-color: var(--action);
}

.motion-toggle:focus-visible {
  outline: 2px solid var(--action);
  outline-offset: 4px;
}

.header {
  margin-bottom: 56px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--bulb-faint);
  text-align: center;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--bulb-soft);
  margin-bottom: 12px;
}

.title {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 32px;
  line-height: 1.2;
  margin: 0;
  letter-spacing: 0.01em;
  color: var(--bulb);
}

.scene-prose { margin-bottom: 40px; }

.scene-title {
  margin: 0 0 28px;
  color: var(--bulb-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  line-height: 1.5;
  text-transform: uppercase;
}

.scene-title:focus { outline: none; }

.scene-prose p {
  margin: 0 0 1.4em;
  color: var(--bulb);
  font-size: 19px;
  line-height: 1.7;
}

.scene-prose p.faded { color: var(--bulb-soft); font-style: italic; }
.scene-prose p.whisper { color: var(--bulb-soft); font-style: italic; font-size: 17px; }
.scene-prose em { color: var(--paper); font-style: italic; }

.slot {
  margin: 36px 0;
  padding: 0;
  background: var(--room-bg-deeper);
  border: 1px solid var(--bulb-faint);
  position: relative;
  min-height: 80px;
  overflow: hidden;
}

.slot-label {
  position: absolute;
  top: 8px;
  left: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bulb-faint);
  z-index: 2;
}

.paper-card {
  background: var(--paper);
  color: var(--ink-on-paper);
  padding: 28px 32px;
  margin: 28px 16px 16px;
  position: relative;
  font-family: 'Songti SC', 'SimSun', 'Noto Serif CJK SC', var(--font-serif);
  font-size: 22px;
  line-height: 1.6;
  letter-spacing: 0.02em;
  box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);
  transform-origin: left center;
  opacity: 0;
  transform: translateX(-30px);
  transition: opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.paper-card.aged { background: var(--paper-aged); }

.paper-card.worn {
  background: var(--paper-worn);
  color: var(--ink-shaky);
  transform: translateX(-30px) rotate(-0.5deg);
  font-family: 'Noto Serif SC', serif;
}

.paper-card.worn.revealed { transform: translateX(0) rotate(-0.5deg); }
.paper-card.revealed { opacity: 1; transform: translateX(0); }

.paper-card.outgoing {
  opacity: 0;
  transform: translateX(30px);
  transition: opacity 1.2s ease-in, transform 1.2s cubic-bezier(0.6, 0, 0.8, 0.2);
}
.paper-card.outgoing.worn { transform: translateX(30px) rotate(-0.5deg); }

.paper-card .characters {
  display: block;
  font-size: 28px;
  letter-spacing: 0.08em;
  line-height: 1.5;
  text-align: center;
  margin: 0;
}

.paper-card.worn .characters {
  font-size: 24px;
  letter-spacing: 0.06em;
  line-height: 1.7;
}

.paper-pile {
  position: absolute;
  top: 4px;
  right: 12px;
  display: flex;
  gap: 2px;
  z-index: 2;
}

.paper-pile-mark {
  width: 6px;
  height: 1px;
  background: var(--bulb-faint);
  display: block;
}

.manual {
  background: rgba(216, 201, 168, 0.04);
  border: 1px solid var(--bulb-faint);
  padding: 24px 28px;
  margin: 36px 0;
  font-family: var(--font-serif);
  position: relative;
  transition: opacity 0.8s ease;
}

.manual.aged { border-color: rgba(168, 152, 120, 0.35); }

.manual-header {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bulb-soft);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--bulb-faint);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}

.manual-header .section-num { color: var(--bulb-faint); }

.manual-searching {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 15px;
  color: var(--bulb-soft);
  text-align: center;
  padding: 14px 0;
  letter-spacing: 0.02em;
  min-height: 1em;
}

.manual-searching .dots::after {
  content: '.';
  animation: dots 1.5s steps(1, end) infinite;
}

@keyframes dots {
  0%, 33% { content: '.'; }
  34%, 66% { content: '..'; }
  67%, 100% { content: '...'; }
}

.manual-rule {
  font-size: 16px;
  line-height: 1.7;
  color: var(--paper-dim);
  font-style: italic;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.manual-rule.revealed { opacity: 1; }

.manual-rule .glyph {
  font-family: 'Noto Serif SC', serif;
  font-style: normal;
  font-size: 19px;
  color: var(--paper);
  letter-spacing: 0.04em;
}

.manual-rule .arrow {
  display: inline-block;
  margin: 0 8px;
  color: var(--bulb-faint);
  font-family: var(--font-mono);
}

.manual-rule .rule-note {
  margin-top: 14px;
  font-size: 14px;
  color: var(--bulb-soft);
  font-style: italic;
}

.action-row {
  margin: 36px 0;
  text-align: center;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.action-row.revealed { opacity: 1; }

.action-btn {
  background: transparent;
  border: 1px solid var(--bulb-soft);
  color: var(--bulb);
  padding: 14px 28px;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 17px;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: all 0.25s ease;
  margin: 0 6px;
}

.action-btn:hover {
  border-color: var(--action);
  color: var(--action-hover);
  background: rgba(200, 164, 103, 0.05);
}

.action-btn:focus {
  outline: 2px solid var(--action);
  outline-offset: 2px;
}

.action-btn:disabled,
.action-btn.disabled {
  opacity: 0.42;
  cursor: not-allowed;
  pointer-events: none;
}

.choice-row {
  margin: 36px 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.choice-row.revealed { opacity: 1; }

.choice-btn {
  background: transparent;
  border: 1px solid var(--bulb-soft);
  color: var(--bulb);
  padding: 20px 24px;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 17px;
  line-height: 1.5;
  text-align: left;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: all 0.25s ease;
}

.choice-btn:hover {
  border-color: var(--action);
  color: var(--action-hover);
  background: rgba(200, 164, 103, 0.04);
}

.choice-btn:focus {
  outline: 2px solid var(--action);
  outline-offset: 2px;
}

.choice-btn:disabled,
.choice-btn.disabled {
  opacity: 0.42;
  cursor: not-allowed;
  pointer-events: none;
}

.choice-prompt {
  margin: 34px 0 18px;
  color: var(--bulb);
  font-size: 18px;
  font-style: italic;
  line-height: 1.65;
}

.beat {
  margin: 28px 0;
  padding: 0;
  font-style: italic;
  color: var(--bulb-soft);
  font-size: 17px;
  line-height: 1.7;
  text-align: left;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}

.beat.revealed { opacity: 1; transform: translateY(0); }
.beat p { margin: 0 0 0.9em; }
.beat p:last-child { margin: 0; }

.frame-break {
  margin-top: 60px;
  padding-top: 48px;
  border-top: 1px solid var(--bulb-faint);
}

.frame-break .speaker-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--action);
  margin-bottom: 18px;
}

.frame-break p {
  font-size: 19px;
  line-height: 1.7;
  margin: 0 0 1.4em;
  color: var(--bulb);
}

.frame-break p.searle-says { color: var(--bulb); }
.frame-break p strong { color: var(--paper); font-weight: 500; }

.frame-break .takeaway {
  margin-top: 36px;
  padding: 24px 28px;
  background: rgba(200, 164, 103, 0.04);
  border-left: 2px solid var(--action);
  font-size: 17px;
  line-height: 1.7;
  color: var(--paper-dim);
}

.frame-break .takeaway strong { color: var(--paper); font-weight: 500; }

.frame-break .citation {
  margin-top: 36px;
  font-size: 14px;
  color: var(--bulb-soft);
  font-style: italic;
  line-height: 1.6;
  border-top: 1px solid var(--bulb-faint);
  padding-top: 18px;
}

.frame-break .citation a {
  color: var(--action-hover);
  text-underline-offset: 3px;
}

.debrief-section {
  margin: 34px 0;
  padding-top: 28px;
  border-top: 1px solid var(--bulb-faint);
}

.debrief-section h2 {
  margin: 0 0 16px;
  color: var(--paper);
  font-size: 23px;
  font-style: italic;
  font-weight: 400;
  line-height: 1.35;
}

.debrief-section p {
  margin-bottom: 1em;
}

.branch-mirror {
  margin: 32px 0;
  padding: 24px 28px;
  border: 1px solid var(--bulb-faint);
  background: rgba(216, 201, 168, 0.035);
}

.branch-mirror p {
  margin: 0 0 0.7em;
}

.branch-mirror p:last-child { margin-bottom: 0; }

.completion-panel {
  margin-top: 42px;
  padding: 26px 28px;
  border: 1px solid var(--bulb-faint);
  background: rgba(200, 164, 103, 0.04);
}

.completion-status {
  min-height: 1.7em;
  margin-top: 18px;
  color: var(--paper);
  font-size: 16px;
  font-style: italic;
}

.intro-card {
  margin: 24px 0 48px;
  padding: 30px;
  border: 1px solid var(--bulb-faint);
  background: rgba(216, 201, 168, 0.035);
}

.intro-card h2 {
  margin: 0 0 18px;
  color: var(--paper);
  font-size: 25px;
  font-style: italic;
  font-weight: 400;
}

.intro-card p {
  margin: 0 0 1.2em;
  color: var(--bulb);
}

.content-details {
  margin: 22px 0;
  color: var(--bulb-soft);
  font-size: 16px;
}

.content-details summary {
  color: var(--action-hover);
  cursor: pointer;
  text-underline-offset: 3px;
}

.intro-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
}

.epilogue {
  margin-top: 48px;
  padding: 32px 0;
  border-top: 1px solid var(--bulb-faint);
}

.epilogue h2,
.epilogue h3 {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 24px;
  color: var(--bulb);
  margin: 0 0 18px;
}

.epilogue-intro {
  font-size: 16px;
  color: var(--bulb-soft);
  font-style: italic;
  margin-bottom: 24px;
  line-height: 1.6;
}

.translation-list { margin-top: 18px; }

.translation-item {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px dashed var(--bulb-faint);
}

.translation-item:last-child { border-bottom: none; }

.translation-item .scene-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bulb-faint);
  margin-bottom: 10px;
}

.translation-item .glyph-line {
  font-family: 'Noto Serif SC', serif;
  font-size: 19px;
  color: var(--paper);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

.translation-item .glyph-line.outgoing {
  color: var(--paper-dim);
  font-size: 17px;
  margin-top: 12px;
}

.translation-item .meaning {
  font-style: italic;
  color: var(--bulb);
  font-size: 17px;
  line-height: 1.6;
}

.translation-item .meaning.outgoing {
  color: var(--bulb-soft);
  font-size: 16px;
  margin-top: 6px;
}

.translation-item .meaning .label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-style: normal;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--bulb-faint);
  margin-right: 8px;
}

.progress {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--bulb-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
}

.progress[hidden] { display: none; }

.progress-text { margin-right: 4px; }

.progress-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bulb-faint);
  transition: background 0.3s ease;
  margin-top: 3px;
}

.progress-dot.active { background: var(--action); }
.progress-dot.completed { background: var(--bulb-soft); }

@media (max-width: 600px) {
  .room { padding: 40px 20px 60px; }
  .utility-row { margin-bottom: 22px; }
  .title { font-size: 24px; }
  .scene-prose p, .frame-break p { font-size: 17px; }
  .paper-card { padding: 22px 22px; margin: 22px 12px 12px; }
  .paper-card .characters { font-size: 24px; }
  .choice-btn { font-size: 16px; padding: 16px 18px; }
  .intro-card, .completion-panel { padding: 24px 20px; }
  .intro-actions .action-btn { width: 100%; margin: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

body.no-motion *,
body.no-motion *::before,
body.no-motion *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  scroll-behavior: auto !important;
  transition-duration: 0.01ms !important;
}

</style>
</head>
<body>

<main class="room" id="room" role="main">
  <div class="utility-row">
    <div
      class="progress"
      id="progress"
      role="progressbar"
      aria-label="Progrés de l'activitat"
      aria-valuemin="1"
      aria-valuemax="5"
      aria-valuenow="1"
      hidden
    ></div>
    <button class="motion-toggle" id="motionToggle" type="button">Omet animacions</button>
  </div>

  <header class="header">
    <div class="eyebrow">Capítol 1 · Activitat B1</div>
    <h1 class="title">L'Habitació</h1>
  </header>

  <div id="sceneContent" aria-live="off"></div>
  <div class="sr-only" id="activityStatus" role="status" aria-live="polite"></div>
</main>

<script src="../shared/enti-widget-bridge.js"></script>
<script>
(() => {
  'use strict';

  const WIDGET_ID = 'B1-chinese-room';
  const WIDGET_VERSION = 2;
  const bridge = createEntiBridge({
    widget: WIDGET_ID,
    version: String(WIDGET_VERSION),
    root: document.querySelector('.widget-frame') || document.body,
  });
  const STORAGE_KEY = 'enti-b1-state-v2';
  const STEP_LABELS = [
    'La primera regla',
    'El ritme',
    'El paper diferent',
    'La decisió',
    "Fora de l'habitació",
  ];

  const defaultState = () => ({
    currentScene: 0,
    scene4Choice: null,
    started: false,
    completed: false,
    completionSent: false,
    skipAnimations: false,
    totalScenes: STEP_LABELS.length,
  });

  const sceneContent = document.getElementById('sceneContent');
  const progress = document.getElementById('progress');
  const activityStatus = document.getElementById('activityStatus');
  const motionToggle = document.getElementById('motionToggle');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  let STATE = { ...defaultState(), ...loadState() };

  function loadState() {
    try {
      const parsed = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch {
      return {};
    }
  }

  function saveState() {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        currentScene: STATE.currentScene,
        scene4Choice: STATE.scene4Choice,
        started: STATE.started,
        completed: STATE.completed,
        completionSent: STATE.completionSent,
        skipAnimations: STATE.skipAnimations,
      }));
    } catch {
      // The experience remains usable when storage is unavailable.
    }
  }

  function resetState() {
    const skipAnimations = STATE.skipAnimations;
    STATE = { ...defaultState(), skipAnimations };
    saveState();
    syncMotionPreference();
    document.body.classList.remove('lamp-dim-1', 'lamp-dim-2', 'lamp-dim-3');
  }

  function animationsAreSkipped() {
    return reducedMotion.matches || STATE.skipAnimations;
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, animationsAreSkipped() ? 0 : ms));
  }

  function syncMotionPreference() {
    const systemReduced = reducedMotion.matches;
    document.body.classList.toggle('no-motion', systemReduced || STATE.skipAnimations);
    motionToggle.disabled = systemReduced;
    motionToggle.setAttribute('aria-pressed', String(STATE.skipAnimations));
    motionToggle.textContent = systemReduced
      ? 'Moviment reduït'
      : STATE.skipAnimations
        ? 'Activa animacions'
        : 'Omet animacions';
  }

  function setActivityStatus(message) {
    activityStatus.textContent = '';
    requestAnimationFrame(() => {
      activityStatus.textContent = message;
    });
  }

  function buildProgress() {
    progress.hidden = !STATE.started;
    if (!STATE.started) return;

    const value = STATE.completed
      ? STATE.totalScenes
      : Math.min(STATE.currentScene + 1, STATE.totalScenes);
    const label = STATE.completed
      ? 'Activitat completada'
      : `Escena ${value} de ${STATE.totalScenes}: ${STEP_LABELS[value - 1]}`;

    progress.innerHTML = '';
    progress.setAttribute('aria-valuenow', String(value));
    progress.setAttribute('aria-valuetext', label);

    const text = document.createElement('span');
    text.className = 'progress-text';
    text.textContent = STATE.completed ? 'Completada' : `${value} / ${STATE.totalScenes}`;
    progress.appendChild(text);

    const dots = document.createElement('span');
    dots.setAttribute('aria-hidden', 'true');
    dots.style.display = 'contents';

    for (let index = 0; index < STATE.totalScenes; index += 1) {
      const dot = document.createElement('span');
      dot.className = 'progress-dot';
      if (STATE.completed || index < STATE.currentScene) dot.classList.add('completed');
      if (!STATE.completed && index === STATE.currentScene) dot.classList.add('active');
      dots.appendChild(dot);
    }

    progress.appendChild(dots);
  }

    sceneContent.replaceChildren();
  }

  function setLampLevel(level) {
    document.body.classList.remove('lamp-dim-1', 'lamp-dim-2', 'lamp-dim-3');
    if (level > 0) document.body.classList.add(`lamp-dim-${level}`);
  }

  function prepareScene(index, title, { focus = true, lamp = 0 } = {}) {
    STATE.currentScene = index;
    STATE.started = true;
    saveState();
    setLampLevel(lamp);
    buildProgress();
    clearScene();

    const heading = document.createElement('h2');
    heading.className = 'scene-title';
    heading.tabIndex = -1;
    heading.textContent = `Escena ${index + 1} · ${title}`;
    sceneContent.appendChild(heading);

    if (focus) {
      window.scrollTo({ top: 0, behavior: animationsAreSkipped() ? 'auto' : 'smooth' });
      requestAnimationFrame(() => heading.focus({ preventScroll: true }));
    }

    setActivityStatus(`Escena ${index + 1} de ${STATE.totalScenes}: ${title}`);
  }

  function renderProse(paragraphs) {
    const wrap = document.createElement('div');
    wrap.className = 'scene-prose';

    paragraphs.forEach(paragraph => {
      const element = document.createElement('p');
      if (paragraph.type === 'p-faded') element.className = 'faded';
      if (paragraph.type === 'p-whisper') element.className = 'whisper';
      element.innerHTML = paragraph.text;
      wrap.appendChild(element);
    });

  async function renderIncomingPaper(glyphs, options = {}) {
    const slot = document.createElement('section');
    slot.className = 'slot';
    slot.setAttribute('aria-label', "Escletxa de l'esquerra: entrada");

    const paperClass = options.worn
      ? 'paper-card worn'
      : options.aged
        ? 'paper-card aged'
        : 'paper-card';

    const pile = document.createElement('div');
    pile.className = 'paper-pile';
    pile.setAttribute('aria-hidden', 'true');
    for (let index = 0; index < (options.pileMarks || 0); index += 1) {
      const mark = document.createElement('span');
      mark.className = 'paper-pile-mark';
      pile.appendChild(mark);
    }

    const label = document.createElement('div');
    label.className = 'slot-label';
    label.textContent = 'Escletxa esquerra · Entrada';

    const paper = document.createElement('div');
    paper.className = paperClass;
    paper.id = 'incomingPaper';

    const characters = document.createElement('span');
    characters.className = 'characters';
    characters.lang = 'zh-Hans';
    characters.textContent = glyphs;
    paper.appendChild(characters);

    slot.append(label);
    if (options.pileMarks) slot.appendChild(pile);
    slot.appendChild(paper);
    sceneContent.appendChild(slot);

    await delay(140);
    paper.classList.add('revealed');
    await delay(620);
  }

  async function renderManualLookup(rule, options = {}) {
    const manual = document.createElement('section');
    manual.className = options.aged ? 'manual aged' : 'manual';
    manual.setAttribute('aria-label', `Manual, ${rule.section}`);
    manual.style.opacity = '0';
    manual.innerHTML = `
      <div class="manual-header">
        <span>Manual</span>
        <span class="section-num">${rule.section}</span>
      </div>
      <div class="manual-searching" role="status" aria-live="polite">
        <em>${rule.searching}</em><span class="dots" aria-hidden="true"></span>
      </div>
    `;
    sceneContent.appendChild(manual);

    await delay(60);
    manual.style.opacity = '1';
    await delay(rule.searchMs || 720);

    const search = manual.querySelector('.manual-searching');
    const result = document.createElement('div');
    result.className = 'manual-rule';
    result.innerHTML = `
      <span class="glyph" lang="zh-Hans">${rule.pattern}</span>
      <span class="arrow" aria-hidden="true">→</span>
      <span class="glyph" lang="zh-Hans">${rule.response}</span>
      ${rule.note ? `<div class="rule-note">${rule.note}</div>` : ''}
    `;
    search.replaceWith(result);
    await delay(60);
    result.classList.add('revealed');
    setActivityStatus('El manual ha trobat una regla i una resposta.');
    await delay(260);
  }

  function renderActionButton(label, onClick, options = {}) {
    const row = document.createElement('div');
    row.className = 'action-row';

    const button = document.createElement('button');
    button.className = 'action-btn';
    button.type = 'button';
    button.textContent = label;
    if (options.id) button.id = options.id;

    let handled = false;
    button.addEventListener('click', async () => {
      if (handled) return;
      handled = true;
      button.disabled = true;
      button.classList.add('disabled');
      try {
        await onClick(button);
      } catch (error) {
        handled = false;
        button.disabled = false;
        button.classList.remove('disabled');
        setActivityStatus("No s'ha pogut continuar. Torna-ho a provar.");
        console.error(error);
      }
    });

    row.appendChild(button);
    sceneContent.appendChild(row);
    requestAnimationFrame(() => row.classList.add('revealed'));
    return button;
  }

  function renderChoiceButtons(choices) {
    return new Promise(resolve => {
      const prompt = document.createElement('p');
      prompt.className = 'choice-prompt';
      prompt.id = 'choicePrompt';
      prompt.textContent = 'No saps què diu el paper. El manual sí que prescriu una resposta. Què fas?';
      sceneContent.appendChild(prompt);

      const row = document.createElement('div');
      row.className = 'choice-row';
      row.setAttribute('role', 'group');
      row.setAttribute('aria-labelledby', 'choicePrompt');

      let handled = false;
      choices.forEach((choice, index) => {
        const button = document.createElement('button');
        button.className = 'choice-btn';
        button.type = 'button';
        button.textContent = choice.label;
        button.addEventListener('click', () => {
          if (handled) return;
          handled = true;
          row.querySelectorAll('button').forEach(item => {
            item.disabled = true;
            item.classList.add('disabled');
          });
          resolve({ index, value: choice.value });
        });
        row.appendChild(button);
      });

      sceneContent.appendChild(row);
      requestAnimationFrame(() => row.classList.add('revealed'));
    });
  }

        </div>

        <p>La lletra tremolosa i el pes del paper podien indicar-te que hi havia alguna cosa important en joc. No et podien dir <em>què</em> hi havia en joc. Eren senyals de gravetat, no significat.</p>

        <p>El missatge deia: <em>«Vaig perdre la meva mare fa una setmana. La noto a faltar. Em sento sola. No sé què fer.»</em></p>

        <p>El manual prescrivia: <em>«Hauries de retrobar-te amb ella, allà on ella estigui. Et sentiràs millor.»</em></p>

        <p>La resposta pot encaixar si la mare s'ha perdut físicament o si el contacte s'ha trencat. Si la mare ha mort, la mateixa resposta es converteix en una altra cosa. Fins i tot traduïda, la frase deixa oberta una informació decisiva; des de dins, tu no tenies accés ni al significat ni a l'ambigüitat.</p>

        <p><strong>Cap de les dues accions era moralment llegible des de dins de l'habitació.</strong> No perquè fossin equivalents, sinó perquè actuaves sense comprendre el missatge.</p>
      </section>

      <section class="debrief-section" aria-labelledby="searleArgument">
        <h2 id="searleArgument">L'argument de l'habitació xinesa</h2>

        <p>John Searle va proposar aquesta habitació com un experiment mental el 1980. La persona de dins pot aplicar regles formals i produir respostes convincents en xinès sense entendre xinès.</p>

        <p>Searle defensava que manipular correctament la forma dels símbols no és, per si sol, comprendre'n el significat. És un argument filosòfic influent, no una prova experimental ni una descripció literal de l'arquitectura d'un model actual.</p>
      </section>

      <section class="debrief-section" aria-labelledby="modelsToday">
        <h2 id="modelsToday">El que passa amb els models actuals</h2>

        <p>Un model de llenguatge no consulta un manual amb una regla escrita per a cada frase. Aprèn una xarxa de paràmetres que estima continuacions probables a partir de grans quantitats de dades i del context que rep.</p>

        <p>Aquests models poden detectar matisos, relacionar informació i resoldre moltes ambigüitats. També poden produir una resposta impecable mentre parteixen d'una interpretació equivocada o d'un context incomplet. La recerca continua debatent si és útil atribuir-los alguna forma de «comprensió», i en quin sentit.</p>

        <p>Per treballar-hi bé no cal resoldre aquest debat. Cal recordar una distinció més pràctica: <strong>una resposta fluida no demostra, tota sola, que el sistema comparteixi el teu context ni que la conclusió sigui adequada al teu cas.</strong></p>
      </section>

      <div class="takeaway">
        <strong>Al teu lloc de treball:</strong> quan una IA redacti un guió de diàleg, un GDD, un missatge a un client o una presentació, pregunta't què pot haver quedat fora del text. Com més important sigui la decisió, més important és revisar les suposicions i aportar-hi context humà.

        <a href="https://doi.org/10.1017/S0140525X00005756" target="_blank" rel="noopener noreferrer">Searle (1980), <em>Minds, brains, and programs</em></a>.
        Per aprofundir en el debat contemporani:
        <a href="https://aclanthology.org/2020.acl-main.463/" target="_blank" rel="noopener noreferrer">Bender i Koller (2020)</a>
        i
        <a href="https://aclanthology.org/2024.tacl-1.41/" target="_blank" rel="noopener noreferrer">Kamath et al. (2024)</a>.
        La veu narrativa és una dramatització, no una citació literal de Searle.

  function validParentOrigin() {
    const configured = new URLSearchParams(window.location.search).get('parentOrigin');
    const candidates = [configured, document.referrer];

    for (const candidate of candidates) {
      if (!candidate) continue;
      try {
        const origin = new URL(candidate).origin;
        if (origin.startsWith('http://') || origin.startsWith('https://')) return origin;
      } catch {
        // Try the next source.
      }
    }
    return null;
  }

  function completionPayload() {
    return {
      type: 'enti-widget-complete',
      widget: WIDGET_ID,
      version: WIDGET_VERSION,
      outcome: {
        completed: true,
        choice: STATE.scene4Choice,
      },
    };
  }

  function showCompletedState() {
    const completeButton = document.getElementById('completeBtn');
    const status = document.getElementById('completionStatus');
    if (!completeButton || !status) return;
    completeButton.disabled = true;
    completeButton.textContent = 'Activitat completada';
    status.textContent = 'La finalització ha quedat registrada. Ja pots tornar al curs.';
  }

  function completeActivity() {
    STATE.completed = true;
    saveState();
    buildProgress();
    showCompletedState();

    const payload = completionPayload();
    document.dispatchEvent(new CustomEvent('enti-widget-complete', { detail: payload }));

    if (!STATE.completionSent && window.parent && window.parent !== window) {
      const targetOrigin = validParentOrigin();
      if (targetOrigin) {
        window.parent.postMessage(payload, targetOrigin);
        STATE.completionSent = true;
        saveState();
      }
    }

    setActivityStatus('Activitat completada. Ja pots tornar al curs.');
  }

  function routeToSavedScene() {
    if (STATE.currentScene === 1) return scene2();
    if (STATE.currentScene === 2) return scene3();
    if (STATE.currentScene === 3) return scene4();
    if (STATE.currentScene === 4 && STATE.scene4Choice) return scene5();
    return scene1();
  }

  function renderIntro() {
    progress.hidden = true;
    clearScene();
    setLampLevel(0);
    window.scrollTo({ top: 0, behavior: 'auto' });

    const hasProgress = STATE.started && !STATE.completed;
    const hasCompleted = STATE.completed && STATE.scene4Choice;
    const intro = document.createElement('section');
    intro.className = 'intro-card';
    intro.setAttribute('aria-labelledby', 'introTitle');
    intro.innerHTML = `
      <h2 id="introTitle" tabindex="-1">Abans d'entrar</h2>
      <p>Aquesta és una experiència narrativa breu. Entraràs en una habitació on podràs actuar sobre missatges que no comprens.</p>
      <p>No cal saber xinès. Pren les decisions que prendries des de dins.</p>

      <details class="content-details">
        <summary>Consulta l'avís de contingut</summary>
        <p>L'activitat tracta el dol, la pèrdua d'un familiar, la solitud i una resposta que pot interpretar-se com a profundament inadequada.</p>
      </details>

      <div class="intro-actions" id="introActions"></div>
    `;
    sceneContent.appendChild(intro);

    const actions = document.getElementById('introActions');
    const addButton = (label, handler) => {
      const button = document.createElement('button');
      button.className = 'action-btn';
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', handler, { once: true });
      actions.appendChild(button);
    };

    if (hasProgress) {
      addButton('Continua on ho vas deixar', routeToSavedScene);
      addButton('Comença de nou', () => {
        resetState();
        scene1();
      });
    } else if (hasCompleted) {
      addButton('Revisa el desenllaç', () => scene5());
      addButton('Comença de nou', () => {
        resetState();
        scene1();
      });
    } else {
      addButton("Entra a l'habitació", () => {
        resetState();
        scene1();
      });
    }

    requestAnimationFrame(() => document.getElementById('introTitle').focus?.({ preventScroll: true }));
  }

  motionToggle.addEventListener('click', () => {
    if (reducedMotion.matches) return;
    STATE.skipAnimations = !STATE.skipAnimations;
    saveState();
    syncMotionPreference();
    setActivityStatus(STATE.skipAnimations ? 'Animacions omeses.' : 'Animacions activades.');
  });

  reducedMotion.addEventListener?.('change', syncMotionPreference);

  window.addEventListener('message', event => {
    const parentOrigin = validParentOrigin();
    if (!parentOrigin || event.origin !== parentOrigin) return;
    if (event.data?.type === 'enti-widget-complete-ack' && event.data?.widget === WIDGET_ID) {
      setActivityStatus('El curs ha confirmat la finalització de l’activitat.');
    }
  });

  syncMotionPreference();
  renderIntro();
  bridge.emitResize();
})();

</script>
</body>
</html>
